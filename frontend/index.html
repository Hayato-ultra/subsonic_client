<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subsonic Client</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="top-bar-inner">
        <h1 class="logo">🎵 Subsonic</h1>
        <nav class="nav-hint" aria-hidden="true">
          <span class="nav-dot"></span>
          <span class="nav-dot"></span>
          <span class="nav-dot"></span>
        </nav>
      </div>
    </header>
    <main class="main-content">
      <section class="content" id="view" aria-live="polite">
        <div class="loading-state">
          <div class="loader"></div>
          <span>Loading…</span>
        </div>
      </section>
    </main>
    <footer class="player-bar" id="player" role="region" aria-label="Music player" hidden>
      <div class="player-glass">
        <div class="player-main">
          <div class="player-left">
            <div class="player-track">
              <img id="player-cover" class="player-cover" src="" alt="">
              <div class="player-info">
                <div id="player-title" class="player-title"></div>
                <div id="player-artist" class="player-artist"></div>
              </div>
            </div>
            <button class="icon-btn btn-play-main" id="btn-toggle" aria-label="Play or pause">
              <svg class="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg class="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="icon-btn" id="btn-next" aria-label="Next">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6-8.5-6v12zm9.5-12h2v12h-2z"/></svg>
            </button>
          </div>
          <div class="player-center">
            <div class="player-progress">
              <span id="time-current" class="time">0:00</span>
              <div class="progress-bar" role="slider" aria-label="Playback progress" tabindex="0">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
              <span id="time-total" class="time">0:00</span>
            </div>
          </div>
          <div class="player-right">
            <div class="player-volume">
              <button class="icon-btn" id="btn-volume" aria-label="Volume">
                <svg class="volume-high" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <svg class="volume-mute" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
              </button>
              <div class="volume-slider" role="slider" aria-label="Volume" tabindex="0">
                <div class="volume-fill" id="volume-fill" style="width: 100%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </footer>
    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
    <script src="/static/app.js"></script>
  </div>
</body>
</html>
