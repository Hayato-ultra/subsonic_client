<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playgeet — Your Library</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=SpotifyMixUI:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-top">
        <a href="#/" class="sidebar-logo" aria-label="Home">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--accent)">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-.72.54-.66.36-1.32.42-2.1.24-2.04-.6-4.44-1.32-7.14-3.66-2.52-2.16-4.2-4.98-4.2-7.92 0-1.26.36-2.4.96-3.36.06-.18.12-.42.12-.66 0-.36-.24-.66-.66-.66-.36 0-.72.24-.96.6-.36.6-.42 1.2-.36 1.86.06 1.26.36 2.52 1.02 3.66.66 1.14 1.5 2.16 2.46 3.06 1.08.96 2.16 1.62 3.3 2.04.36.12.66.12.96 0 .36-.12.66-.36.96-.72.36-.48.42-.96.3-1.5-.12-.42-.3-1.02-.36-1.56-.06-.36.06-.66.3-.96.36-.36.72-.54 1.14-.54.42 0 .78.18 1.02.6.24.36.36.72.42 1.2.06.48-.06 1.02-.36 1.5-.18.36-.42.6-1.02.84-1.32.78-2.7.9-4.14.3-1.44-.6-2.76-2.1-3.66-3.96-.96-1.86-1.44-3.96-1.44-6.12 0-1.62.42-3.06 1.26-4.32.48-.72 1.14-1.2-0.06-1.92-.54-.42-1.32-.36-2.1.18-1.08.72-1.92 1.86-2.52 3.24-.36.9-.48 1.86-.36 2.76.06 1.62.48 3.18 1.2 4.56.72 1.38 1.86 2.46 3.3 3.18 1.44.72 3.06 1.02 4.62.84 1.56-.18 2.94-.72 4.14-1.62 1.2-.9.24-1.32-.18-1.92-.42-.66-1.38-.54-2.16.12-.36.36-.66.72-.96 1.2-.36.42-.66.78-1.08 1.14-.42.36-.78.6-.96.78-.18.3-.24.54-.18.78.06.36.36.66.72.9.36.24.72.36 1.08.36.42 0 .78-.18 1.02-.54.3-.42.42-.96.36-1.5-.06-.54-.3-1.08-.6-1.56-.36-.6-.72-1.02-1.14-1.32-.42-.3-.06-.72.36-1.26.42-.54.72-.96 1.14-1.32.48-.42.84-.72 1.2-1.02.36-.3.6-.54.72-.72.12-.18.18-.36.12-.6-.06-.36-.3-.66-.6-.96z"/>
          </svg>
          <span>Playgeet</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="#/" class="nav-item nav-home active" data-view="home">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
          <span>Home</span>
        </a>
        <a href="#/library" class="nav-item nav-library" data-view="library">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20v-2c0-1.1.9-2 2-2h14a2 2 0 012 2v2H3zm-2-8V8c0-1.1.9-2 2-2h14a2 2 0 012 2v4c0-1.1-.9-2-2-2H5a2 2 0 00-2 2zm2 2c-.55 0-1 .45-1 1s.45 1 1 1h14c.55 0 1-.45 1-1s-.45-1-1-1H5zm0-6c-.55 0-1-.45-1-1s.45-1 1-1h14c.55 0 1-.45 1-1s-.45-1-1-1H5z"/></svg>
          <span>Your Library</span>
        </a>
      </nav>
      <div class="sidebar-bottom">
        <a href="#/playlists" class="nav-item nav-playlists" data-view="playlists">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
          <span>Playlists</span>
        </a>
        <a href="#/import" class="nav-item nav-import" data-view="import">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Import</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="top-bar-inner">
          <div class="top-bar-left">
            <button class="icon-btn" id="btn-sidebar-toggle" aria-label="Toggle sidebar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <nav class="breadcrumb" aria-label="Breadcrumb">
              <span class="breadcrumb-item">Home</span>
            </nav>
            </div>
          <div class="top-bar-right">
            <div class="search-container">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 2a8.5 8.5 0 105.263 15.542l5.5 5.5a1 1 0 001.414-1.414l-5.5-5.5A8.5 8.5 0 0010.5 2zm0 2a6.5 6.5 0 110 13 6.5 6.5 0 010-13z"/></svg>
              <input type="text" class="search-input" id="search-input" placeholder="What do you want to listen to?" aria-label="Search">
            </div>
            <button class="icon-btn" id="btn-notifications" aria-label="Notifications">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            </button>
            <div class="user-avatar">
              <span>U</span>
            </div>
          </div>
        </div>
      </header>

      <!-- View Container -->
      <section class="view-container" id="view" aria-live="polite">
        <div class="loading-state">
          <div class="loader"></div>
          <span>Loading…</span>
        </div>
      </section>
    </main>

    <!-- Player Bar -->
    <footer class="player-bar" id="player" role="region" aria-label="Music player" hidden>
      <div class="player-glass">
        <div class="player-main">
          <div class="player-left">
            <div class="player-track">
              <img id="player-cover" class="player-cover" src="" alt="">
              <div class="player-info">
                <div id="player-title" class="player-title"></div>
                <div id="player-artist" class="player-artist"></div>
              </div>
            </div>
            <button class="icon-btn player-control" id="btn-like" aria-label="Like">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
            <button class="icon-btn" id="btn-playing-now" aria-label="Now playing">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </button>
          </div>
          <div class="player-center">
            <div class="player-progress">
              <span id="time-current" class="time">0:00</span>
              <div class="progress-bar" role="slider" aria-label="Playback progress" tabindex="0">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
              <span id="time-total" class="time">0:00</span>
            </div>
          </div>
          <div class="player-right">
            <button class="icon-btn player-control" id="btn-shuffle" aria-label="Shuffle">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 2a8.5 8.5 0 105.263 15.542l5.5 5.5a1 1 0 001.414-1.414l-5.5-5.5A8.5 8.5 0 0010.5 2zm0 2a6.5 6.5 0 110 13 6.5 6.5 0 010-13z"/></svg>
            </button>
            <button class="icon-btn player-control" id="btn-prev" aria-label="Previous">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="icon-btn btn-play-main" id="btn-toggle" aria-label="Play or pause">
              <svg class="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg class="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="icon-btn player-control" id="btn-next" aria-label="Next">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6-8.5-6v12zm9.5-12h2v12h-2z"/></svg>
            </button>
            <button class="icon-btn player-control" id="btn-repeat" aria-label="Repeat">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
            <div class="player-volume">
              <button class="icon-btn" id="btn-volume" aria-label="Volume">
                <svg class="volume-high" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <svg class="volume-mute" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
              </button>
              <div class="volume-slider" role="slider" aria-label="Volume" tabindex="0">
                <div class="volume-fill" id="volume-fill" style="width: 100%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
    <script src="/static/app.js"></script>
  </div>
</body>
</html>
